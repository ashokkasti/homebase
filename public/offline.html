<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Homebase · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfc;
        --text: #1b1d22;
        --muted: #6b707b;
        --accent: #5b5bd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0f;
          --text: #e8e9ec;
          --muted: #8b909b;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      h1 {
        font-size: 22px;
        margin: 18px 0 6px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Homebase needs a connection to reach your server.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
